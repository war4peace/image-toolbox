    unit_of_measurement: "MB"

  - name: "Image Toolbox Remote GPU VRAM Used"
    state_topic: image-toolbox/system/remote/gpu_vram
    unique_id: image_toolbox_remote_gpu_vram_used
    unit_of_measurement: "MB"

  - name: "Image Toolbox Remote GPU VRAM Total"
    state_topic: image-toolbox/system/remote/gpu_vram_total
