# =====================================================================
# Image Toolbox - CUSTOM dashboard card (HACS eye-candy tier)
# =====================================================================
# Same information as dashboard-core.yaml, rendered with named HACS custom
# cards for a nicer status header, band-coloured metric tiles and real
# time-series graphs. Install these from HACS > Frontend first (repo URLs):
#
#   Mushroom          https://github.com/piitaya/lovelace-mushroom
#   ApexCharts card   https://github.com/RomRider/apexcharts-card
#   card-mod          https://github.com/thomasloven/lovelace-card-mod   (optional)
#   auto-entities     https://github.com/thomasloven/lovelace-auto-entities (optional)
#
# A minimal set is Mushroom + ApexCharts (the tiles + graphs). card-mod and
# auto-entities are only used by the optional extras noted inline.
#
# UPDATED IN 0.5.8 - if you already have this card, the simplest upgrade is to
# open it, "Show code editor", select all and paste this file over it. What is
# new (each marked `# NEW in 0.5.8` inline):
#   * a progress arc on the live-task card, from the new "Task Progress Percent"
#     template sensor (re-copy template-sensors.yaml first, or that card will
#     show as an unknown entity);
#   * a last-run tile: what the last run did, how long it took and what the pod
#     cost, read from the `last_run` attributes;
#   * wording, now that the Video Upscaler reports here too: a video run counts
#     FRAMES in progress and per-item times, not files.
#
# This is ONE card (a vertical stack of sub-cards), pasted into a single
# card's code editor - NOT the whole-dashboard raw editor. Steps:
#   1. Add the entities first (mqtt-sensors.yaml + template-sensors.yaml) and
#      install the HACS cards above.
#   2. Edit your dashboard > "+ ADD SECTION" > add any card (e.g. a Heading).
#   3. On that card, click "Show code editor", select all, and paste
#      EVERYTHING below (from `type: vertical-stack` to the end).
#
# The metric tiles are coloured to match the app's own bands:
#   blue <=25  |  green <=65/75  |  orange <=85/90  |  red above.

type: vertical-stack
cards:
  # ---- status chips header ---------------------------------------
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: sensor.image_toolbox_task_name
        icon: >-
          {{ 'mdi:cog' if states('sensor.image_toolbox_task_name') != 'idle'
             else 'mdi:sleep' }}
        icon_color: >-
          {{ 'green' if states('sensor.image_toolbox_task_name') != 'idle'
             else 'grey' }}
        content: "{{ states('sensor.image_toolbox_task_name') | title }}"
      - type: template
        entity: sensor.image_toolbox_gpu_temperature
        icon: mdi:thermometer
        icon_color: >-
          {% set t = states('sensor.image_toolbox_gpu_temperature') | float(0) %}
          {{ 'red' if t > 85 else 'orange' if t > 70 else 'green' }}
        content: "{{ states('sensor.image_toolbox_gpu_temperature') }}°C"
      - type: template
        entity: sensor.image_toolbox_update_available
        icon: mdi:package-up
        content: "{{ states('sensor.image_toolbox_version') }}"
      - type: entity
        entity: sensor.image_toolbox_availability

  # ---- live task (only while a task is running) ------------------
  - type: conditional
    conditions:
      - entity: sensor.image_toolbox_task_name
        state_not: idle
      - entity: sensor.image_toolbox_task_name
        state_not: unavailable
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          primary: "{{ states('sensor.image_toolbox_task_name') | title }}"
          # A video run counts FRAMES here, an image run counts files.
          secondary: >-
            {{ states('sensor.image_toolbox_task_details') }} -
            {{ states('sensor.image_toolbox_task_progress') }} -
            ETA {{ states('sensor.image_toolbox_task_eta') }}
          icon: mdi:cog-play
          icon_color: green
        # NEW in 0.5.8: the same progress as an arc. Needs the "Task Progress
        # Percent" sensor from template-sensors.yaml.
        # This one is a CORE gauge on purpose: Mushroom has no bar card, and its
        # number card only accepts a settable `number` entity, not a sensor. Core
        # and custom cards mix freely. For a true horizontal bar, install
        # bar-card (https://github.com/custom-cards/bar-card) and swap in:
        #   type: custom:bar-card
        #   entity: sensor.image_toolbox_task_progress_percent
        #   max: 100
        - type: gauge
          name: Progress
          entity: sensor.image_toolbox_task_progress_percent
          min: 0
          max: 100
          needle: false

  # ---- NEW in 0.5.8: what the last run did ------------------------
  # Read from the `last_run` JSON attributes, so it covers all four tools.
  # `cost` is filled in only by a run on a rented pod, and is left out otherwise.
  - type: custom:mushroom-template-card
    entity: sensor.image_toolbox_last_run_summary
    icon: mdi:history
    icon_color: blue
    primary: >-
      {%- set nice = {'upscale': 'Batch Upscaler', 'tag': 'Tag & Rename',
                      'video': 'Video Upscaler', 'conciliating': 'Conciliation'} %}
      {%- set tool = state_attr('sensor.image_toolbox_last_run_summary', 'tool') | default('Last run') %}
      Last run: {{ nice.get(tool, tool) }}
    secondary: >-
      {%- set a = 'sensor.image_toolbox_last_run_summary' %}
      {{ state_attr(a, 'processed') | default(0) }} processed,
      {{ state_attr(a, 'failed') | default(0) }} failed
      {%- set secs = state_attr(a, 'elapsed_seconds') | default(0) | float %}
      {%- if secs >= 3600 %} in {{ (secs / 3600) | round(1) }} h
      {%- elif secs >= 60 %} in {{ (secs / 60) | round(1) }} min
      {%- elif secs > 0 %} in {{ secs | round | int }} s{% endif %}
      {%- if state_attr(a, 'cost') %} - ${{ '%.2f' | format(state_attr(a, 'cost') | float) }} of pod time{% endif %}

  # ---- band-coloured metric tiles --------------------------------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: CPU
        secondary: "{{ states('sensor.image_toolbox_cpu_usage') }}%"
        icon: mdi:cpu-64-bit
        icon_color: >-
          {% set v = states('sensor.image_toolbox_cpu_usage') | float(0) %}
          {{ 'red' if v > 85 else 'orange' if v > 65 else 'green' if v > 25 else 'blue' }}
      - type: custom:mushroom-template-card
        primary: GPU util
        secondary: "{{ states('sensor.image_toolbox_gpu_utilization') }}%"
        icon: mdi:expansion-card
        icon_color: >-
          {% set v = states('sensor.image_toolbox_gpu_utilization') | float(0) %}
          {{ 'red' if v > 85 else 'orange' if v > 65 else 'green' if v > 25 else 'blue' }}
      - type: custom:mushroom-template-card
        primary: VRAM
        secondary: >-
          {{ states('sensor.image_toolbox_vram_percent') }}%
          ({{ (states('sensor.image_toolbox_gpu_vram_used') | float(0) / 1024) | round(1) }} GB)
        icon: mdi:memory
        icon_color: >-
          {% set v = states('sensor.image_toolbox_vram_percent') | float(0) %}
          {{ 'red' if v > 90 else 'orange' if v > 75 else 'green' if v > 25 else 'blue' }}
      - type: custom:mushroom-template-card
        primary: RAM
        secondary: >-
          {{ states('sensor.image_toolbox_ram_percent') }}%
          ({{ (states('sensor.image_toolbox_ram_used') | float(0) / 1024) | round(1) }} GB)
        icon: mdi:memory
        icon_color: >-
          {% set v = states('sensor.image_toolbox_ram_percent') | float(0) %}
          {{ 'red' if v > 90 else 'orange' if v > 75 else 'green' if v > 25 else 'blue' }}
      - type: custom:mushroom-template-card
        primary: GPU power
        secondary: "{{ states('sensor.image_toolbox_gpu_power_draw') }} W"
        icon: mdi:lightning-bolt
        icon_color: orange
      - type: custom:mushroom-template-card
        primary: GPU clock
        secondary: "{{ states('sensor.image_toolbox_gpu_clock') }} MHz"
        icon: mdi:speedometer
        icon_color: blue

  # ---- local telemetry graph (ApexCharts) ------------------------
  - type: custom:apexcharts-card
    header:
      show: true
      title: Local telemetry
    graph_span: 1h
    yaxis:
      - id: pct
        min: 0
        max: 100
    series:
      - entity: sensor.image_toolbox_gpu_utilization
        name: GPU util
        yaxis_id: pct
      - entity: sensor.image_toolbox_cpu_usage
        name: CPU
        yaxis_id: pct
      - entity: sensor.image_toolbox_vram_percent
        name: VRAM
        yaxis_id: pct
      - entity: sensor.image_toolbox_gpu_temperature
        name: Temp
        yaxis_id: pct

  # ---- GPU power (its own axis, watts) ---------------------------
  - type: custom:apexcharts-card
    header:
      show: true
      title: GPU power
    graph_span: 1h
    series:
      - entity: sensor.image_toolbox_gpu_power_draw
        name: Power
        unit: W

  # ---- remote pod (only during a remote-pod run) -----------------
  # 0.5.8: a remote VIDEO run lights this panel up too, not just the image tools.
  - type: conditional
    conditions:
      - entity: sensor.image_toolbox_remote_gpu_vram_total
        state_not: "0"
      - entity: sensor.image_toolbox_remote_gpu_vram_total
        state_not: unavailable
      - entity: sensor.image_toolbox_remote_gpu_vram_total
        state_not: unknown
    card:
      type: custom:apexcharts-card
      header:
        show: true
        title: Remote pod telemetry
      graph_span: 1h
      yaxis:
        - id: pct
          min: 0
          max: 100
      series:
        - entity: sensor.image_toolbox_remote_gpu_utilization
          name: Pod GPU util
          yaxis_id: pct
        - entity: sensor.image_toolbox_remote_vram_percent
          name: Pod VRAM
          yaxis_id: pct
        - entity: sensor.image_toolbox_remote_gpu_temperature
          name: Pod temp
          yaxis_id: pct

  # ---- OPTIONAL: list every Image Toolbox entity (auto-entities) --
  # Uncomment after installing auto-entities; handy for debugging.
  # - type: custom:auto-entities
  #   card:
  #     type: entities
  #     title: All Image Toolbox entities
  #   filter:
  #     include:
  #       - entity_id: sensor.image_toolbox_*
