# --- Added in 0.5.0: the rented pod ----------------------------------
#
# These exist only DURING a remote-pod run and are zeroed when the pod is torn
# down, so gaps and zeros between runs are normal.
# 0.5.8: a remote VIDEO run reports here too (before, only the image tools did).

  - name: "Image Toolbox Remote CPU Usage"
    state_topic: image-toolbox/system/remote/cpu
    unique_id: image_toolbox_remote_cpu_usage
    unit_of_measurement: "%"

  - name: "Image Toolbox Remote RAM Used"
