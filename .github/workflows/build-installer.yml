name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to the release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # need the annotated tag object for release notes

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+(\.\d+)?$') { $ver = '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer\ImageToolbox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        # v7 runs on Node 24. v5 still shipped Node 20 (the earlier v4->v5 bump
        # missed that — only v6+ moved to Node 24), so it kept tripping the
        # deprecation warning. checkout@v5 and action-gh-release@v3 are already
        # Node 24.
        uses: actions/upload-artifact@v7
        with:
          name: ImageToolboxSetup
          path: installer/Output/ImageToolboxSetup.exe

      - name: Build release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # The annotated tag message is the single source of curated, user-
          # facing notes (shown verbatim in the in-app update dialog). Strip
          # commit/tag trailers and any PGP signature so users see only the
          # human notes — no compare URLs, no code-level detail.
          #
          # actions/checkout can leave the tag *lightweight* in the runner, in
          # which case %(contents) dereferences to the COMMIT message. Force-
          # fetch the tag so we read the real annotation object.
          $tag = "${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" 2>$null
          $msg = git for-each-ref "refs/tags/$tag" --format='%(contents)'
          $keep = $msg -split "`n" | Where-Object {
            $_ -notmatch '^(Co-Authored-By|Signed-off-by):' -and $_ -notmatch '^-----'
          }
          ($keep -join "`n").Trim() | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          "----- release notes -----"
          Get-Content RELEASE_NOTES.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/ImageToolboxSetup.exe
          body_path: RELEASE_NOTES.md
